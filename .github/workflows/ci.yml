name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: constraints.txt
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress --yes
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[dev,upload]"
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Offline unit and video integration tests
        run: |
          ffmpeg -version
          pytest -q
      - name: Build distribution and inspect repository
        run: |
          python -m build
          python scripts/check_repository.py
          python -m pip check
      - name: Audit dependencies
        if: runner.os == 'Linux'
        run: python -m pip_audit --local --skip-editable --progress-spinner off
